<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

:root {
    --primary: #2563eb;
    --primary-dark: #1e3a8a;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
}

/* ===== BODY ===== */
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 1rem;
    background: var(--bg);
    color: var(--text);

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* ===== CONTENEDOR ===== */
.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== CARD ===== */
.card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 25px;
    width: 100%;
    max-width: 420px;
}

/* ===== TITULO ===== */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* ===== INPUTS ===== */
label {
    font-weight: 600;
    display: block;
    margin-top: 15px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
}

/* ===== FILA STOCK ===== */
.stock-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.stock-row div {
    flex: 1;
}

/* ===== BOTONES ===== */
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    color: white;
    background: var(--primary);
    transition: .2s;
}

button:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #6b7280;
}

.btn-secondary:hover {
    background: #4b5563;
}

.inline-btn {
    background: #8e44ad;
}

.inline-btn:hover {
    background: #9b59b6;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    font-size: 14px;
    color: #666;
    padding: 15px;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Agregar producto</h2>

<form id="productoForm">

<label>Producto</label>
<input type="text" name="producto" required>

<label>Unidad</label>
<select name="unidad" required>
    <option value="kg">Kg</option>
    <option value="piezas">Piezas</option>
    <option value="gramos">Gramos</option>
    <option value="litros">Litros</option>
    <option value="paquetes">Paquetes</option>
</select>

<label>Categoría</label>
<select name="subcoleccion" id="categoriasSelect" required>
    <option value="">Cargando...</option>
</select>

<div class="stock-row">
    <div>
        <label>Stock mínimo</label>
        <input type="number" name="stock_min" required>
    </div>

    <div>
        <label>Stock máximo</label>
        <input type="number" name="stock_max" required>
    </div>
</div>

<button type="button" class="inline-btn" onclick="crearSubcoleccion()">
    + Nueva categoría
</button>

<button type="submit">Crear producto</button>

</form>

<button class="btn-secondary" onclick="window.location.href='/productos'">
    ← Regresar
</button>

</div>
</div>

<footer>
    <hr>
    <p>
        © 2026 Inventario Time |
        <a href="/privacidad">Aviso de Privacidad</a> |
        <a href="/terminos">Términos y Condiciones</a>
    </p>
</footer>


<script>
async function crearSubcoleccion() {
    const nombre = prompt("Nombre de la nueva categoría:");

    if (!nombre) return;

    const subcoleccion = nombre.trim().toLowerCase();

    const response = await fetch("/inventario_base/crear-subcoleccion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subcoleccion })
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.detail || "Error al crear la categoría");
        return;
    }

    const select = document.getElementById("subcoleccionSelect");

    const option = document.createElement("option");
    option.value = subcoleccion;
    option.textContent = nombre;
    option.selected = true;

    select.appendChild(option);

    alert("Categoría creada y seleccionada");
}

const form = document.getElementById("productoForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const producto = form.producto.value.trim();
    const unidad = form.unidad.value;
    const subcoleccion = form.subcoleccion.value;
    const minimo=form.stock_min.value;
    const maximo=form.stock_max.value;

    const response = await fetch(`/inventario/base/producto/${subcoleccion}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ producto, unidad,minimo,maximo })
    });

    if (response.ok) {
        alert("Producto creado correctamente");
        form.reset();
    } else {
        const data = await response.json();
        alert(data.detail || "Error al crear producto");
    }
});
async function cargarCategorias() {
    const select = document.getElementById("categoriasSelect");

    try {
        const response = await fetch("/inventario_base/obtener-subcoleccion");
        const categorias = await response.json();

        select.innerHTML = "";

        categorias.forEach(cat => {
            const option = document.createElement("option");
            option.value = cat;
            option.textContent = cat.replace(/_/g, " ");
            select.appendChild(option);
        });

    } catch (error) {
        select.innerHTML = "<option>Error al cargar categorías</option>";
    }
}

document.addEventListener("DOMContentLoaded", cargarCategorias);
</script>

</body>
</html>
