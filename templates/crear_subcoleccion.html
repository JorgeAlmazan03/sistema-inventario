<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Categoría</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root {
    --primary: #2563eb;
    --primary-dark: #1e3a8a;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
}

/* ===== BODY ===== */
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 1rem;
    background: var(--bg);
    color: var(--text);

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* ===== CONTENEDOR ===== */
.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== CARD ===== */
.card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 25px;
    width: 100%;
    max-width: 420px;
}

/* ===== TITULO ===== */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* ===== INPUTS ===== */
label {
    font-weight: 600;
    display: block;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
}

/* ===== BOTONES ===== */
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    color: white;
    background: var(--primary);
    transition: .2s;
}

button:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #6b7280;
}

.btn-secondary:hover {
    background: #4b5563;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    font-size: 14px;
    color: #666;
    padding: 15px;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Crear categoría</h2>

<form id="subcoleccionForm">

<label>Nombre de la categoría</label>
<input type="text" name="subcoleccion" placeholder="Ej: congelados" required>

<button type="submit">Crear categoría</button>

<button type="button" class="btn-secondary"
        onclick="window.location.href='/productos'">
    ← Regresar
</button>

</form>

</div>
</div>

<footer>
    <hr>
    <p>
        © 2026 Inventario Time |
        <a href="/privacidad">Aviso de Privacidad</a> |
        <a href="/terminos">Términos y Condiciones</a>
    </p>
</footer>
<script>
const form = document.getElementById("subcoleccionForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const subcoleccion = form.subcoleccion.value.trim().toLowerCase();

    if (!subcoleccion) {
        alert("El nombre no puede estar vacío");
        return;
    }

    const response = await fetch("/inventario_base/crear-subcoleccion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subcoleccion })
    });

    const data = await response.json();

    if (response.ok) {
        alert("Categoría creada correctamente");
        form.reset();
    } else {
        alert(data.detail || "Error al crear la categoría");
    }
});
</script>

</body>
</html>
